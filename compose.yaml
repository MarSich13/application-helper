services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/application_helper
      DATABASE_USER: application_helper
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: application_helper
      POSTGRES_USER: application_helper
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_helper -d application_helper"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
