services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: application_helper
      POSTGRES_USER: application_helper
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application_helper -d application_helper"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
